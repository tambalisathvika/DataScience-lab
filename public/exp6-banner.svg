<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="50%" stop-color="#115e59" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="glow6" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="340" fill="url(#bg6)" />

  <!-- Grid overlay -->
  <g opacity="0.1" stroke="#2dd4bf" stroke-width="1">
    <line x1="0" y1="60" x2="600" y2="60" />
    <line x1="0" y1="120" x2="600" y2="120" />
    <line x1="0" y1="180" x2="600" y2="180" />
    <line x1="0" y1="240" x2="600" y2="240" />
    <line x1="120" y1="0" x2="120" y2="340" />
    <line x1="240" y1="0" x2="240" y2="340" />
    <line x1="360" y1="0" x2="360" y2="340" />
    <line x1="480" y1="0" x2="480" y2="340" />
  </g>

  <circle cx="300" cy="135" r="85" fill="#0d9488" opacity="0.25" filter="url(#glow6)" />

  <!-- Center Time Series Graphics: Clock Hub & Temporal Wave -->
  <g transform="translate(130, 60)">
    <rect width="340" height="150" rx="10" fill="#042f2e" opacity="0.6" stroke="#2dd4bf" stroke-width="2" filter="url(#glow6)" />

    <!-- Clock Icon -->
    <circle cx="70" cy="75" r="38" fill="#115e59" stroke="#2dd4bf" stroke-width="2" />
    <circle cx="70" cy="75" r="4" fill="#ffffff" />
    <line x1="70" y1="75" x2="70" y2="52" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <line x1="70" y1="75" x2="88" y2="75" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" />
    <text x="70" y="128" fill="#5eead4" font-size="9" font-family="monospace" text-anchor="middle">date_range()</text>

    <!-- Resampling Sine Wave -->
    <g transform="translate(130, 20)">
      <line x1="10" y1="80" x2="180" y2="80" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="3 3" />
      <!-- Volatile Raw Series -->
      <path d="M 10,80 L 25,65 L 40,85 L 55,50 L 70,75 L 85,45 L 100,70 L 115,35 L 130,60 L 145,25 L 160,50 L 175,20" fill="none" stroke="#99f6e4" stroke-width="1.2" opacity="0.7" stroke-dasharray="2 2" />
      <!-- Smooth Downsampled Weekly Mean -->
      <path d="M 10,78 Q 55,60 95,50 T 175,25" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round" />
      
      <!-- Timestamp Tags -->
      <rect x="15" y="95" width="45" height="18" rx="3" fill="#134e4a" />
      <text x="37" y="107" fill="#5eead4" font-size="8" font-family="monospace" text-anchor="middle">2026Q1</text>

      <rect x="70" y="95" width="45" height="18" rx="3" fill="#134e4a" />
      <text x="92" y="107" fill="#5eead4" font-size="8" font-family="monospace" text-anchor="middle">2026Q2</text>

      <rect x="125" y="95" width="45" height="18" rx="3" fill="#134e4a" />
      <text x="147" y="107" fill="#5eead4" font-size="8" font-family="monospace" text-anchor="middle">2026Q3</text>
    </g>
  </g>

  <!-- Badge & Typography -->
  <rect x="40" y="260" width="520" height="60" rx="8" fill="#0f172a" opacity="0.9" stroke="#115e59" stroke-width="1" />
  <text x="60" y="285" fill="#2dd4bf" font-size="10" font-family="system-ui, sans-serif" font-weight="bold" letter-spacing="2">EXPERIMENT 06 • TIME SERIES ANALYSIS</text>
  <text x="60" y="306" fill="#ffffff" font-size="15" font-family="system-ui, sans-serif" font-weight="bold">DatetimeIndex, Timezones, Period Arithmetic &amp; Resampling</text>
</svg>