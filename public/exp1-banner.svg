<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="340" fill="url(#bg1)" />

  <!-- Grid overlay -->
  <g opacity="0.1" stroke="#a5b4fc" stroke-width="1">
    <line x1="0" y1="60" x2="600" y2="60" />
    <line x1="0" y1="120" x2="600" y2="120" />
    <line x1="0" y1="180" x2="600" y2="180" />
    <line x1="0" y1="240" x2="600" y2="240" />
    <line x1="120" y1="0" x2="120" y2="340" />
    <line x1="240" y1="0" x2="240" y2="340" />
    <line x1="360" y1="0" x2="360" y2="340" />
    <line x1="480" y1="0" x2="480" y2="340" />
  </g>

  <!-- Glowing background orb -->
  <circle cx="300" cy="150" r="90" fill="#6366f1" opacity="0.2" filter="url(#glow1)" />

  <!-- Central Visual: 3 Document Cards (Text, JSON, Excel) -->
  <!-- Card 1: Text / CSV -->
  <g transform="translate(140, 80)">
    <rect width="80" height="110" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" />
    <rect width="80" height="26" rx="8" fill="#4338ca" />
    <text x="40" y="18" fill="#ffffff" font-size="11" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">.CSV / TXT</text>
    <line x1="15" y1="45" x2="65" y2="45" stroke="#a5b4fc" stroke-width="3" stroke-linecap="round" />
    <line x1="15" y1="62" x2="55" y2="62" stroke="#a5b4fc" stroke-width="3" stroke-linecap="round" />
    <line x1="15" y1="79" x2="60" y2="79" stroke="#a5b4fc" stroke-width="3" stroke-linecap="round" />
    <line x1="15" y1="96" x2="45" y2="96" stroke="#a5b4fc" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Card 2: JSON (Center elevated) -->
  <g transform="translate(255, 60)">
    <rect width="90" height="130" rx="8" fill="#0f172a" stroke="#c084fc" stroke-width="2.5" filter="url(#glow1)" />
    <rect width="90" height="30" rx="8" fill="#7e22ce" />
    <text x="45" y="20" fill="#ffffff" font-size="12" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">{ JSON }</text>
    <text x="18" y="55" fill="#e9d5ff" font-size="11" font-family="monospace">"id": 101,</text>
    <text x="18" y="75" fill="#e9d5ff" font-size="11" font-family="monospace">"dept": "DS",</text>
    <text x="18" y="95" fill="#e9d5ff" font-size="11" font-family="monospace">"data": [...]</text>
    <text x="18" y="115" fill="#c084fc" font-size="11" font-family="monospace">}</text>
  </g>

  <!-- Card 3: Excel -->
  <g transform="translate(380, 80)">
    <rect width="80" height="110" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="2" />
    <rect width="80" height="26" rx="8" fill="#047857" />
    <text x="40" y="18" fill="#ffffff" font-size="11" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">.XLSX</text>
    <!-- Spreadsheet Grid -->
    <rect x="12" y="38" width="26" height="16" fill="#065f46" stroke="#10b981" stroke-width="1" />
    <rect x="42" y="38" width="26" height="16" fill="#065f46" stroke="#10b981" stroke-width="1" />
    <rect x="12" y="58" width="26" height="16" fill="#065f46" stroke="#10b981" stroke-width="1" />
    <rect x="42" y="58" width="26" height="16" fill="#065f46" stroke="#10b981" stroke-width="1" />
    <rect x="12" y="78" width="26" height="16" fill="#065f46" stroke="#10b981" stroke-width="1" />
    <rect x="42" y="78" width="26" height="16" fill="#065f46" stroke="#10b981" stroke-width="1" />
  </g>

  <!-- Flow pipeline connector line -->
  <path d="M 120,240 L 480,240" stroke="url(#purpleGrad)" stroke-width="3" stroke-linecap="round" />
  <circle cx="200" cy="240" r="5" fill="#818cf8" />
  <circle cx="300" cy="240" r="7" fill="#c084fc" />
  <circle cx="400" cy="240" r="5" fill="#34d399" />

  <!-- Badge & Typography -->
  <rect x="40" y="260" width="520" height="60" rx="8" fill="#0f172a" opacity="0.9" stroke="#312e81" stroke-width="1" />
  <text x="60" y="285" fill="#c084fc" font-size="10" font-family="system-ui, sans-serif" font-weight="bold" letter-spacing="2">EXPERIMENT 01 • DATA INGESTION</text>
  <text x="60" y="306" fill="#ffffff" font-size="15" font-family="system-ui, sans-serif" font-weight="bold">File Formats: Text, JSON &amp; Microsoft Excel</text>
</svg>