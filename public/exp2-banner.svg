<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#082f49" />
      <stop offset="50%" stop-color="#0c4a6e" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="340" fill="url(#bg2)" />

  <!-- Grid overlay -->
  <g opacity="0.1" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="60" x2="600" y2="60" />
    <line x1="0" y1="120" x2="600" y2="120" />
    <line x1="0" y1="180" x2="600" y2="180" />
    <line x1="0" y1="240" x2="600" y2="240" />
    <line x1="120" y1="0" x2="120" y2="340" />
    <line x1="240" y1="0" x2="240" y2="340" />
    <line x1="360" y1="0" x2="360" y2="340" />
    <line x1="480" y1="0" x2="480" y2="340" />
  </g>

  <circle cx="300" cy="140" r="85" fill="#0284c7" opacity="0.2" filter="url(#glow2)" />

  <!-- Left: Web API Cloud -->
  <g transform="translate(130, 80)">
    <rect width="110" height="100" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <rect width="110" height="26" rx="10" fill="#0284c7" />
    <text x="55" y="18" fill="#ffffff" font-size="11" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">REST Web API</text>
    <!-- Cloud & Endpoint -->
    <path d="M 35,65 C 30,65 25,60 25,52 C 25,45 30,40 37,40 C 40,32 50,30 58,35 C 64,30 74,33 77,40 C 83,41 87,46 87,52 C 87,60 81,65 75,65 Z" fill="#0369a1" />
    <rect x="20" y="74" width="70" height="16" rx="3" fill="#075985" />
    <text x="55" y="86" fill="#bae6fd" font-size="9" font-family="monospace" text-anchor="middle">GET /api/v1/data</text>
  </g>

  <!-- Bidirectional Connection Wire -->
  <g transform="translate(250, 120)">
    <line x1="0" y1="10" x2="100" y2="10" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4 3" />
    <polygon points="98,10 88,5 88,15" fill="#38bdf8" />
    <polygon points="2,10 12,5 12,15" fill="#38bdf8" />
    <circle cx="50" cy="10" r="14" fill="#0f172a" stroke="#06b6d4" stroke-width="2" />
    <text x="50" y="14" fill="#38bdf8" font-size="10" font-family="monospace" font-weight="bold" text-anchor="middle">SQL</text>
  </g>

  <!-- Right: SQLite Database Cylinder -->
  <g transform="translate(360, 65)">
    <rect width="110" height="120" rx="10" fill="#0f172a" stroke="#06b6d4" stroke-width="2" filter="url(#glow2)" />
    <!-- Cylinder Top -->
    <ellipse cx="55" cy="30" rx="42" ry="14" fill="#0891b2" stroke="#22d3ee" stroke-width="1.5" />
    <!-- Cylinder Body Lines -->
    <path d="M 13,30 L 13,85 C 13,95 97,95 97,85 L 97,30" fill="none" stroke="#22d3ee" stroke-width="1.5" />
    <path d="M 13,50 C 13,60 97,60 97,50" fill="none" stroke="#0891b2" stroke-width="1.5" />
    <path d="M 13,68 C 13,78 97,78 97,68" fill="none" stroke="#0891b2" stroke-width="1.5" />
    <text x="55" y="112" fill="#22d3ee" font-size="11" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">SQLite 3 Engine</text>
  </g>

  <!-- Badge & Typography -->
  <rect x="40" y="260" width="520" height="60" rx="8" fill="#0f172a" opacity="0.9" stroke="#075985" stroke-width="1" />
  <text x="60" y="285" fill="#38bdf8" font-size="10" font-family="system-ui, sans-serif" font-weight="bold" letter-spacing="2">EXPERIMENT 02 • DATA EXTRACTION</text>
  <text x="60" y="306" fill="#ffffff" font-size="15" font-family="system-ui, sans-serif" font-weight="bold">Web APIs &amp; SQLite Database Connectivity</text>
</svg>