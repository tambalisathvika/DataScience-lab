<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4c0519" />
      <stop offset="50%" stop-color="#881337" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="roseGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="glow5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="340" fill="url(#bg5)" />

  <!-- Grid overlay -->
  <g opacity="0.1" stroke="#fb7185" stroke-width="1">
    <line x1="0" y1="60" x2="600" y2="60" />
    <line x1="0" y1="120" x2="600" y2="120" />
    <line x1="0" y1="180" x2="600" y2="180" />
    <line x1="0" y1="240" x2="600" y2="240" />
    <line x1="120" y1="0" x2="120" y2="340" />
    <line x1="240" y1="0" x2="240" y2="340" />
    <line x1="360" y1="0" x2="360" y2="340" />
    <line x1="480" y1="0" x2="480" y2="340" />
  </g>

  <circle cx="300" cy="135" r="85" fill="#e11d48" opacity="0.25" filter="url(#glow5)" />

  <!-- Center Visualization Montage: Line Chart, Bars, Box Plot -->
  <g transform="translate(130, 60)">
    <rect width="340" height="150" rx="10" fill="#1e1b4b" opacity="0.5" stroke="#fb7185" stroke-width="2" filter="url(#glow5)" />

    <!-- Left: Bars (Grouped & Stacked) -->
    <g transform="translate(25, 25)">
      <line x1="0" y1="95" x2="80" y2="95" stroke="#94a3b8" stroke-width="1.5" />
      <rect x="10" y="30" width="14" height="65" rx="2" fill="#38bdf8" />
      <rect x="30" y="15" width="14" height="80" rx="2" fill="#fb7185" />
      <rect x="50" y="45" width="14" height="50" rx="2" fill="#34d399" />
      <text x="37" y="112" fill="#cbd5e1" font-size="9" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">Bar Plots</text>
    </g>

    <!-- Center: Line Curve with Annotation Arrow -->
    <g transform="translate(130, 25)">
      <line x1="0" y1="95" x2="80" y2="95" stroke="#94a3b8" stroke-width="1.5" />
      <path d="M 5,75 Q 30,60 45,30 T 75,10" fill="none" stroke="#f43f5e" stroke-width="2.5" />
      <circle cx="75" cy="10" r="4" fill="#ffffff" stroke="#f43f5e" stroke-width="2" />
      <!-- Arrow -->
      <line x1="40" y1="10" x2="68" y2="10" stroke="#facc15" stroke-width="1.5" />
      <polygon points="72,10 64,7 64,13" fill="#facc15" />
      <text x="37" y="112" fill="#cbd5e1" font-size="9" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">Line &amp; Annotate</text>
    </g>

    <!-- Right: Boxplot / KDE -->
    <g transform="translate(235, 25)">
      <line x1="0" y1="95" x2="80" y2="95" stroke="#94a3b8" stroke-width="1.5" />
      <!-- Boxplot -->
      <line x1="40" y1="15" x2="40" y2="85" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="2 2" />
      <line x1="25" y1="15" x2="55" y2="15" stroke="#f59e0b" stroke-width="1.5" />
      <line x1="25" y1="85" x2="55" y2="85" stroke="#f59e0b" stroke-width="1.5" />
      <rect x="22" y="35" width="36" height="35" rx="3" fill="#f59e0b" opacity="0.3" stroke="#f59e0b" stroke-width="1.5" />
      <line x1="22" y1="52" x2="58" y2="52" stroke="#ffffff" stroke-width="2" />
      <text x="40" y="112" fill="#cbd5e1" font-size="9" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">Box &amp; KDE</text>
    </g>
  </g>

  <!-- Badge & Typography -->
  <rect x="40" y="260" width="520" height="60" rx="8" fill="#0f172a" opacity="0.9" stroke="#9f1239" stroke-width="1" />
  <text x="60" y="285" fill="#fb7185" font-size="10" font-family="system-ui, sans-serif" font-weight="bold" letter-spacing="2">EXPERIMENT 05 • DATA VISUALIZATION</text>
  <text x="60" y="306" fill="#ffffff" font-size="15" font-family="system-ui, sans-serif" font-weight="bold">Matplotlib &amp; Seaborn: Subplots, Histograms, Scatter &amp; Box</text>
</svg>