<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="mbuNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1b3d" />
      <stop offset="100%" stop-color="#050e24" />
    </linearGradient>
    <linearGradient id="mbuGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="mbuTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
  </defs>
  
  <!-- Outer Shield Badge -->
  <path d="M 80,8 C 118,8 148,22 148,46 C 148,96 112,136 80,152 C 48,136 12,96 12,46 C 12,22 42,8 80,8 Z" 
        fill="url(#mbuNavy)" stroke="url(#mbuGold)" stroke-width="4" />
        
  <!-- Inner Shield Ring -->
  <path d="M 80,18 C 110,18 136,29 136,49 C 136,90 106,124 80,138 C 54,124 24,90 24,49 C 24,29 50,18 80,18 Z" 
        fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.6" />

  <!-- Torch / Flame of Wisdom -->
  <path d="M 80,28 C 84,36 89,42 85,50 C 82,56 75,54 75,48 C 75,42 77,36 80,28 Z" fill="url(#mbuGold)" />
  <path d="M 80,32 C 82,37 84,41 81,46 C 79,48 76,46 77,42 C 77,38 78,35 80,32 Z" fill="#fef3c7" />

  <!-- Open Academic Book -->
  <path d="M 52,70 Q 80,64 80,78 Q 80,64 108,70 L 108,86 Q 80,80 80,94 Q 80,80 52,86 Z" 
        fill="#ffffff" stroke="url(#mbuGold)" stroke-width="2" />
  <line x1="80" y1="78" x2="80" y2="94" stroke="#0b1b3d" stroke-width="2" />
  <line x1="58" y1="75" x2="74" y2="73" stroke="#94a3b8" stroke-width="1.5" />
  <line x1="58" y1="80" x2="74" y2="78" stroke="#94a3b8" stroke-width="1.5" />
  <line x1="86" y1="73" x2="102" y2="75" stroke="#94a3b8" stroke-width="1.5" />
  <line x1="86" y1="78" x2="102" y2="80" stroke="#94a3b8" stroke-width="1.5" />

  <!-- Prominent MBU Text -->
  <text x="80" y="118" text-anchor="middle" font-family="'Plus Jakarta Sans', Inter, sans-serif" 
        font-size="22" font-weight="900" fill="#ffffff" letter-spacing="2">MBU</text>
        
  <!-- Sub-label -->
  <text x="80" y="132" text-anchor="middle" font-family="'Plus Jakarta Sans', Inter, sans-serif" 
        font-size="7.5" font-weight="800" fill="url(#mbuGold)" letter-spacing="1.5">ESTD. 1992</text>
